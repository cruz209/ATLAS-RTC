[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rtc"
version = "0.2.0"
description = "Token-level runtime control for LLM generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Christopher Cruz"}
]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
# Primary GPU backend — HuggingFace for full logit control
gpu = [
  "torch>=2.3.0",
  "transformers>=4.40",
  "accelerate>=0.29",
  "huggingface-hub>=0.22",
]
# vLLM backend (production throughput, degraded logit control on v0.18)
vllm = [
  "torch>=2.3.0",
  "vllm>=0.4.0",
  "transformers>=4.40",
  "huggingface-hub>=0.22",
]
# Full research environment
all = [
  "torch>=2.3.0",
  "transformers>=4.40",
  "accelerate>=0.29",
  "huggingface-hub>=0.22",
  "scikit-learn>=1.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_rtc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
